<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Melody + Chord — model comparison</title>
<style>
  :root{ --bg:#f5f2ec; --panel:#fff; --line:#e6e1d6; --ink:#20242c; --dim:#74706a; --accent:#b07b3a;
    --serif:"Iowan Old Style",Palatino,Georgia,serif; --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
  .wrap{max-width:1280px;margin:0 auto;padding:32px 20px 90px}
  h1{font-family:var(--serif);font-weight:600;font-size:1.7rem;margin:0 0 2px}
  .sub{color:var(--dim);margin:0 0 20px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tab{font:600 13px var(--sans);padding:8px 14px;border:1px solid var(--line);background:#faf8f2;border-radius:10px 10px 0 0;cursor:pointer;color:#4b4a46}
  .tab.on{background:#fff;border-bottom-color:#fff;color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset}
  .prompts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:22px}
  .plabel{color:var(--dim);font-size:13px;margin-right:6px}
  .pbtn{font:600 13px var(--sans);min-width:44px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:#4b4a46}
  .pbtn.on{background:#2a2e36;color:#fff;border-color:#2a2e36}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(40,34,22,.05)}
  .rowhead{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  .rowtitle b{font-family:var(--serif);font-size:1.06rem}
  .rowtitle .dim{color:var(--dim);font-weight:400;font-size:13px}
  .legend{display:flex;gap:14px;color:var(--dim);font-size:12.5px}
  .legend .lg{display:inline-flex;align-items:center}
  .legend i{width:11px;height:11px;border-radius:3px;margin-right:6px;display:inline-block}
  .varsel{margin-left:auto;display:flex;align-items:center;gap:8px}
  .vnav{width:30px;height:26px;border:1px solid var(--line);background:#faf8f2;border-radius:7px;cursor:pointer;color:#4b4a46;font-size:12px}
  .vnav:hover{background:#fff;border-color:#d9d2c4}
  .vlabel{font:600 12px var(--sans);color:var(--dim);min-width:34px;text-align:center}
  .roll{width:100%;height:200px;background:#fffdf8;border:1px solid var(--line);border-radius:10px;cursor:pointer;display:block}
  .roll.playing{cursor:col-resize}
  .transport{display:flex;align-items:center;gap:12px;margin-top:10px;padding:0 2px}
  .play{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;color:#2a2e36;box-shadow:0 2px 8px rgba(40,34,22,.1)}
  .play.on{background:#2a2e36;color:#fff}
  .time{font:600 13px var(--sans);color:var(--dim);min-width:96px;font-variant-numeric:tabular-nums}
  .seek{flex:1;accent-color:#3F7FD6}

  .groupbpm{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;font-weight:600}
  .bpmin{width:62px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;font:600 13px var(--sans);color:var(--ink);background:#fff}
  .expnote{color:var(--dim);font-size:13px;margin:-8px 0 18px;font-style:italic}
  .err{color:#b23}
</style>
</head>
<body>
<div class="wrap">
  <h1>Melody + Chord — model comparison</h1>
  <p class="sub">For each prompt, compare the input against each model's output. Tracks are coloured by role (melody / chord) and played through piano. Click or drag a roll to seek; use &#10094; &#10095; to switch a model's variations.</p>
  <div id="tabs" class="tabs"></div>
  <div id="prompts" class="prompts"></div>
  <div id="rows"></div>
</div>
<script src="lib/Tone.js?v=1789072881"></script>
<script src="lib/midi-parse.js?v=1789072881"></script>
<script src="app.js?v=1789072881"></script>
</body>
</html>
